<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAT 1 - Formulir dan Simpan Progres</title>
<style>html,body{margin:0;height:100%;font:16px/1.6 system-ui,sans-serif;background:#f6f7f9;color:#173a63}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#loading{padding:24px}#warning{position:fixed;bottom:8px;left:8px;right:8px;background:#fff3d6;color:#713f12;padding:12px;z-index:10;border:1px solid #d97706;border-radius:8px}#warning[hidden]{display:none}</style>
</head>
<body>
<p id="loading" role="status">Memuat formulir CAT dan fitur simpan progres...</p>
<div id="warning" role="alert" hidden></div>
<iframe id="catForm" title="Formulir CAT 1 dengan penyimpanan progres"></iframe>
<noscript>Aktifkan JavaScript untuk mengisi dan menyimpan formulir ini.</noscript>
<script>
'use strict';
const frame = document.getElementById('catForm');
frame.addEventListener('load', () => {
  const warning = document.getElementById('warning');
  const fail = () => { warning.hidden = false; warning.textContent = 'Fitur simpan tambahan gagal dimuat. Muat ulang halaman. Tombol Save working file pada formulir asli tetap dapat digunakan untuk membuat cadangan.'; };
  try {
    const doc = frame.contentDocument;
    if (!doc || !doc.getElementById('btnSave')) { fail(); return; }
    const script = doc.createElement('script');
    script.src = new URL('./save-progress.js?v=20261004-save1', location.href).href;
    script.onerror = fail;
    script.onload = () => {
      if (!frame.contentWindow.catProgressReady) { fail(); return; }
      warning.hidden = true; document.getElementById('loading').hidden = true;
    };
    doc.body.appendChild(script);
  } catch (_) { fail(); }
});
frame.src = './CAT1_2026-2%20%287%29.html';
</script>
</body>
</html>
